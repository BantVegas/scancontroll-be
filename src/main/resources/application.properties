spring.application.name=sc-text

server.port=${PORT:8080}

# Kam voláme Python
python.compare.one.url=http://127.0.0.1:8011/api/compare-one
python.compare.legacy.url=http://127.0.0.1:8011/api/compare

# Firestore kolekcie
firestore.collection.reports=compare_reports
firestore.collection.feedback=compare_feedback
firestore.collection.ignore_rules=compare_ignore_rules

# multipart limity
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB


server.tomcat.max-http-form-post-size=64MB
server.tomcat.max-swallow-size=64MB


